name: Sync upstream

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.repository == 'hahaen/kitty-tools'
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REPOSITORY: YyAdnBug/kitty-tools
      FORK_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Sync the default branch
        shell: bash
        run: |
          upstream_branch=$(git ls-remote --symref "https://github.com/${UPSTREAM_REPOSITORY}.git" HEAD |
            awk '$1 == "ref:" && $3 == "HEAD" { sub(/^refs\/heads\//, "", $2); print $2 }')

          if [[ -z "$upstream_branch" || "$upstream_branch" != "$FORK_DEFAULT_BRANCH" ]]; then
            printf 'Upstream default branch "%s" differs from fork default branch "%s".\n' \
              "$upstream_branch" "$FORK_DEFAULT_BRANCH" >&2
            exit 1
          fi

          gh api --method POST "repos/${GITHUB_REPOSITORY}/merge-upstream" \
            --raw-field "branch=${upstream_branch}"
