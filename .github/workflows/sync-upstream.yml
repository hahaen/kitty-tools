name: Sync upstream

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'hahaen/kitty-tools'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_REPOSITORY: YyAdnBug/kitty-tools
    steps:
      - name: Sync branches and tags
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          def refs(repository):
              result = subprocess.check_output(
                  ['git', 'ls-remote', '--refs', '--heads', '--tags',
                   f'https://github.com/{repository}.git'], text=True,
              )
              return dict((ref, sha) for sha, ref in
                          (line.split('	', 1) for line in result.splitlines()))

          def post(endpoint, payload):
              result = subprocess.run(
                  ['gh', 'api', '--method', 'POST', endpoint, '--input', '-'],
                  input=json.dumps(payload), text=True, capture_output=True,
              )
              if result.returncode:
                  print(result.stderr.strip())
                  return False
              print(json.loads(result.stdout).get('message', 'Created ref'))
              return True

          repository = os.environ['GITHUB_REPOSITORY']
          upstream = refs(os.environ['UPSTREAM_REPOSITORY'])
          fork = refs(repository)
          if not any(ref.startswith('refs/heads/') for ref in upstream):
              raise SystemExit('No upstream branches found.')

          failed = []
          for ref, sha in sorted(upstream.items()):
              if fork.get(ref) == sha:
                  continue
              print(f'Syncing {ref}', flush=True)
              if ref not in fork:
                  ok = post(f'repos/{repository}/git/refs', {'ref': ref, 'sha': sha})
              elif ref.startswith('refs/heads/'):
                  branch = ref.removeprefix('refs/heads/')
                  ok = post(f'repos/{repository}/merge-upstream', {'branch': branch})
              else:
                  print('The existing fork tag points to a different object.')
                  ok = False
              if not ok:
                  failed.append(ref)

          print(f'Checked {len(upstream)} upstream branch and tag refs.')
          if failed:
              raise SystemExit('Sync failed for: ' + ', '.join(failed))
          PY
